name: Supabase migrations (shared)

# One set of migration steps for every environment. Called by dev.yml and production.yml;
# never triggered on its own. Each caller names a GitHub environment (dev, production) that
# holds that environment's secrets under the same names:
#   SUPABASE_ACCESS_TOKEN   personal access token of the Supabase account
#   SUPABASE_DB_PASSWORD    database password of that environment's project
# The caller must pass `secrets: inherit`: without it this workflow sees none of them, even with
# the environment set on its job.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment that holds the secrets (dev or production)
        type: string
        required: true
      project-ref:
        description: Supabase project ref of that environment
        type: string
        required: true
      apply:
        description: false previews the pending migrations only (dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: ${{ inputs.apply && 'Apply' || 'Preview' }} migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.project-ref }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Check credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN in the '$TARGET_ENVIRONMENT' GitHub environment"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing secret SUPABASE_DB_PASSWORD in the '$TARGET_ENVIRONMENT' GitHub environment"; exit 1; }
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]] || { echo "::error::'$SUPABASE_PROJECT_REF' is not a Supabase project ref"; exit 1; }

      # The run's log needs a GitHub sign-in to read, but its annotations do not: say plainly which
      # secret is wrong instead of failing inside `supabase link` with only "exit code 1".
      - name: Check the access token
        shell: bash
        run: |
          status=$(curl -s -o /dev/null -m 30 -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")
          case "$status" in
            200) echo "The access token can read project $SUPABASE_PROJECT_REF." ;;
            401) echo "::error::SUPABASE_ACCESS_TOKEN in the '$TARGET_ENVIRONMENT' GitHub environment is invalid, expired or revoked. Create a new token in Supabase (Account > Access Tokens) with the project and the Project Settings, API Keys and API Key Secrets permissions (Read), then update the secret."; exit 1 ;;
            403) echo "::error::SUPABASE_ACCESS_TOKEN in the '$TARGET_ENVIRONMENT' GitHub environment cannot read project $SUPABASE_PROJECT_REF. Create a token scoped to this project with the Project Settings, API Keys and API Key Secrets permissions (Read)."; exit 1 ;;
            404) echo "::error::Project $SUPABASE_PROJECT_REF is not visible to the account of SUPABASE_ACCESS_TOKEN."; exit 1 ;;
            *) echo "::error::Supabase answered HTTP $status when checking SUPABASE_ACCESS_TOKEN; try the run again."; exit 1 ;;
          esac

      - name: Link the project
        shell: bash
        run: |
          set -o pipefail
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" 2>&1 | tee link.log; then
            echo "::error::supabase link failed (a wrong SUPABASE_DB_PASSWORD shows as a password authentication error): $(tail -n 3 link.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        if: inputs.apply
        run: supabase db push --linked
